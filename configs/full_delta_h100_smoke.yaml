data:
  dataset: HuggingFaceFW/fineweb
  dataset_config: sample-10BT
  dataset_split: train
  text_column: text
  max_context_tokens: 256
  min_context_tokens: 64
  positions_per_document: 2
  extraction_batch_documents: 8
  extraction_shard_rows: 64
  top_k_diagnostics: 8
  quotas: {av_sft: 8, ar_sft: 8, rl: 16, eval: 8}

delta:
  injection_alpha: 1.0
  prediction_loss_weight: 0.1
  prediction_baseline_examples: 16

teacher:
  batch_size: 1
  max_new_tokens: 128
  do_sample: false
  temperature: 0.0
  enable_thinking: false
  shard_rows: 8
  max_retries: 2

sft:
  epochs: 1
  global_batch_size: 4
  micro_batch_size: 2
  learning_rate: 1.0e-5
  min_learning_rate_ratio: 0.1
  warmup_ratio: 0.05
  weight_decay: 0.1
  max_grad_norm: 1.0
  validation_fraction: 0.25
  validation_examples: 2
  checkpoint_interval: 1

rl:
  group_size: 2
  prompts_per_step: 2
  max_steps: 2
  minimum_steps: 1
  response_max_new_tokens: 96
  temperature: 1.0
  top_p: 1.0
  policy_clip: 0.2
  policy_kl_coefficient: 0.01
  av_learning_rate: 1.0e-5
  ar_learning_rate: 1.0e-5
  weight_decay: 0.1
  av_micro_batch_size: 2
  ar_micro_batch_size: 2
  max_grad_norm: 1.0
  checkpoint_interval: 1
  evaluation_interval: 1
  evaluation_examples: 2
  early_stopping_patience: 2
  invalid_format_penalty: 1.0
  cap_hit_penalty: 0.25

runtime:
  device: cuda
  train_dtype: bfloat16
  teacher_dtype: bfloat16
  num_dataloader_workers: 0
  budget_hours: 4
  shutdown_on_success: false
  shutdown_on_failure: false
