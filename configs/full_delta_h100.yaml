schema_version: 1
experiment_name: qwen05b_full_delta_nla
seed: 42
run_dir: /home/paperspace/runs/qwen05b_full_delta_nla

models:
  target: Qwen/Qwen2.5-0.5B-Instruct
  av_init: Qwen/Qwen2.5-0.5B-Instruct
  ar_init: Qwen/Qwen2.5-0.5B-Instruct
  teacher: google/gemma-4-31B-it
  qwen_revision: 7ae557604adf67be50417f59c2c2f167def9a775
  teacher_revision: 842da3794eaa0b77d5f08bae87a17459d91ff475

data:
  dataset: HuggingFaceFW/fineweb
  dataset_config: sample-10BT
  dataset_split: train
  text_column: text
  max_context_tokens: 1024
  min_context_tokens: 64
  positions_per_document: 3
  extraction_batch_documents: 24
  extraction_shard_rows: 4096
  top_k_diagnostics: 15
  quotas:
    av_sft: 25000
    ar_sft: 25000
    rl: 200000
    eval: 5000

delta:
  injection_alpha: 1.0
  prediction_loss_weight: 0.1
  prediction_baseline_examples: 10000

teacher:
  batch_size: 1
  max_new_tokens: 128
  do_sample: false
  temperature: 0.0
  enable_thinking: false
  shard_rows: 512
  max_retries: 4

sft:
  epochs: 1
  global_batch_size: 256
  micro_batch_size: 16
  learning_rate: 1.0e-5
  min_learning_rate_ratio: 0.1
  warmup_ratio: 0.05
  weight_decay: 0.1
  max_grad_norm: 1.0
  validation_fraction: 0.05
  validation_examples: 1024
  checkpoint_interval: 50

rl:
  group_size: 8
  prompts_per_step: 64
  max_steps: 3000
  minimum_steps: 1000
  response_max_new_tokens: 96
  temperature: 1.0
  top_p: 1.0
  policy_clip: 0.2
  policy_kl_coefficient: 0.05
  av_learning_rate: 3.0e-6
  ar_learning_rate: 1.0e-5
  weight_decay: 0.1
  av_micro_batch_size: 16
  ar_micro_batch_size: 32
  max_grad_norm: 1.0
  checkpoint_interval: 250
  evaluation_interval: 250
  evaluation_examples: 512
  early_stopping_patience: 4
  invalid_format_penalty: 1.0
  cap_hit_penalty: 0.25
  format_guard_window: 20
  format_guard_min_valid_rate: 0.50
  format_guard_max_cap_hit_rate: 0.50

runtime:
  device: cuda
  train_dtype: bfloat16
  teacher_dtype: bfloat16
  num_dataloader_workers: 2
  budget_hours: 145
  shutdown_on_success: true
  shutdown_on_failure: true
